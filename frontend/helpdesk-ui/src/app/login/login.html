<div style="max-width: 350px; margin: 100px auto;">
  <h2>Helpdesk Login</h2>
  <input type="email" [(ngModel)]="email" placeholder="Email" style="width:100%; margin-bottom:10px; padding:8px;" />
  <input type="password" [(ngModel)]="password" placeholder="Password" style="width:100%; margin-bottom:10px; padding:8px;" />
  <button (click)="login()" style="width:100%; padding:8px;">Login</button>
  <p style="color:red" *ngIf="error">{{ error }}</p>
</div>
